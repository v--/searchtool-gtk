[project]
name = "searchtool-gtk"
version = "2.4.1"
description = "A generic GTK search tool and launcher"
license = "Unlicense"
license-files = ["LICENSES/Unlicense.txt"]
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Ianis Vasilev", email = "ianis@ivasilev.net" }
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  # The rest of the classifiers will hopefully be populated dynamically at some point
  #   See https://github.com/astral-sh/uv/issues/8716
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

dependencies = [
  "msgspec (>=0.21)",
  "platformdirs (>=4.10.0)",
  "pygobject (>=3.54)",
  "pyicu (>=2.16)",
  "wcmatch (>=10)",
]

[project.urls]
Repository = "https://github.com/v--/searchtool-gtk.git"
Changelog = "https://github.com/v--/searchtool-gtk/blob/master/CHANGELOG.md"

[project.scripts]
searchtool-gtk-server = "searchtool_gtk:entry_point"
searchtool-gtk-dmenu = "searchtool_gtk:dmenu_client"
searchtool-gtk-activate = "searchtool_gtk:basic_client"

[dependency-groups]
dev = [
  "pygobject-stubs (>=2.16)",
  "mypy (>=2.2)",
  "ruff (>=0.15.20)",
  "ruff-config-ivasilev @ git+https://github.com/v--/ruff-config-ivasilev.git@v0.15.post9",
]

[build-system]
# uv build complains if no upper bound is set, but it updates its minor versions often, so we put a major version just to shut it up
requires = ["uv_build (>=0.10, <1)"]
build-backend = "uv_build"

# uv
[tool.uv]
resolution = "lowest-direct"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md", "REUSE.toml", "searchtool.toml"]

# ruff
[tool.ruff]
extend = ".venv/share/ruff/ruff.ivasilev.toml"
preview = true

[tool.ruff.lint]
ignore = [
  # undocumented-*
  "D1",

  # GTK callbacks violate some rules often enough so blanket-ban the rules
  "unused-function-argument",

  # Overriden GTK methods are not recognized as overriden
  "no-self-use",
  "unused-method-argument",
]

# mypy
[tool.mypy]
packages = ["searchtool_gtk"]

[[tool.mypy.overrides]]
module = [
  "icu.*",
]
ignore_missing_imports = true
