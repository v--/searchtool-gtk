# This the the default config. Copy to a user directory to customize.

# BinMode simply lists the contents of PATH
[modes.binary]
class = "searchtool_gtk.modes.BinMode"

# FileMode lists files according to wcmatch-style glob patterns.
[modes.file]
class = "searchtool_gtk.modes.FileMode"
patterns = [
  # "~/Documents/*.pdf",
]

# All other values are optional.
# For example, if you can have more than one file mode active, you may want to customize the title
title = "Books"

# Customize the wcmatch flags (the following default is used if the option is not specified)
wcmatch_flags = ["NEGATE", "GLOBSTAR", "BRACE", "GLOBTILDE"]

## ICU collation options for the file mode
# icu_locale =
# icu_strength =

## The ClipHistMode is useful for, well, cliphist. It is disabled by default since cliphist may not be installed.
# [modes.clipboard]
## This class aims to replace the legacy dmenu-like ClipHistMode
# class = "searchtool_gtk.modes.ClipHistStandaloneMode"

